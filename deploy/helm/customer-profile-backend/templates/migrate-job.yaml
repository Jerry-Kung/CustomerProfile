{{- if .Values.migration.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Values.names.migrate }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "customer-profile-backend.commonLabels" . | nindent 4 }}
    app: {{ .Values.names.migrate }}
    app.kubernetes.io/component: migration
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: {{ .Values.migration.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "customer-profile-backend.commonLabels" . | nindent 8 }}
        app: {{ .Values.names.migrate }}
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: {{ .Values.migration.terminationGracePeriodSeconds }}
      containers:
        - name: customer-profile-migrate
          image: {{ include "customer-profile-backend.image" . | quote }}
          imagePullPolicy: {{ .Values.migration.imagePullPolicy | default .Values.image.pullPolicy }}
          command:
            - customer-profile-migrate
          env:
            - name: APP_ENV
              value: {{ .Values.config.APP_ENV | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.config.LOG_LEVEL | quote }}
            - name: WORKFLOW_PLATFORM
              value: {{ .Values.config.WORKFLOW_PLATFORM | quote }}
            - name: QINGTIAN_BASE_URL
              value: {{ .Values.config.QINGTIAN_BASE_URL | quote }}
            - name: QINGTIAN_USER_ID
              value: {{ .Values.config.QINGTIAN_USER_ID | quote }}
            - name: QINGTIAN_POLL_INTERVAL_MS
              value: {{ .Values.config.QINGTIAN_POLL_INTERVAL_MS | quote }}
            - name: QINGTIAN_POLL_TIMEOUT_MS
              value: {{ .Values.config.QINGTIAN_POLL_TIMEOUT_MS | quote }}
            - name: QINGTIAN_API_KEY_TEST
              value: {{ .Values.secrets.local.QINGTIAN_API_KEY_TEST | quote }}
            - name: QINGTIAN_API_KEY_PRODUCTION
              value: {{ .Values.secrets.local.QINGTIAN_API_KEY_PRODUCTION | quote }}
            - name: QINGTIAN_INVITATION_STRATEGY_API_KEY
              value: {{ .Values.secrets.common.QINGTIAN_INVITATION_STRATEGY_API_KEY | quote }}
            - name: MYSQL_HOST
              value: {{ .Values.config.MYSQL_HOST | quote }}
            - name: MYSQL_PORT
              value: {{ .Values.config.MYSQL_PORT | quote }}
            - name: MYSQL_DATABASE
              value: {{ .Values.config.MYSQL_DATABASE | quote }}
            - name: MYSQL_USER
              value: {{ .Values.secrets.common.MYSQL_USER | quote }}
            - name: MYSQL_PASSWORD
              value: {{ .Values.secrets.common.MYSQL_PASSWORD | quote }}
            - name: MIGRATION_DB_WAIT_MAX_TRIES
              value: {{ .Values.config.MIGRATION_DB_WAIT_MAX_TRIES | quote }}
            - name: MIGRATION_DB_WAIT_INTERVAL_MS
              value: {{ .Values.config.MIGRATION_DB_WAIT_INTERVAL_MS | quote }}
          resources:
            {{- toYaml .Values.migration.resources | nindent 12 }}
{{- end }}

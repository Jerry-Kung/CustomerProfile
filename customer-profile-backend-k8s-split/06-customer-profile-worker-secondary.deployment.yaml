apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-profile-worker-secondary
  namespace: aizt01-pro
  labels:
    app: customer-profile-worker-secondary
    app.kubernetes.io/name: customer-profile-backend
    app.kubernetes.io/component: worker
    app.kubernetes.io/instance: secondary
  annotations:
    lke.io/creator: lirui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: customer-profile-worker-secondary
  template:
    metadata:
      labels:
        app: customer-profile-worker-secondary
        app.kubernetes.io/name: customer-profile-backend
        app.kubernetes.io/component: worker
        app.kubernetes.io/instance: secondary
      annotations:
        lke.io/creator: lirui
        lke.io/imagepullsecrets: '{}'
    spec:
      containers:
      - name: container-customer-profile-worker-secondary
        image: registry.dfmc.com.cn/mhero-ai/customer-profile-backend:arm64-latest
        imagePullPolicy: Always
        command:
        - customer-profile-worker
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: '2'
            memory: 1Gi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - name: logs
          mountPath: /app/logs
        env:
        - name: APP_ENV
          value: prod
        - name: LOG_LEVEL
          value: INFO
        - name: LOG_DIR
          value: /app/logs
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: API_HOST
          value: 0.0.0.0
        - name: API_PORT
          value: '18008'
        - name: TASK_UPLOAD_DIR
          value: /var/lib/customer-profile/task-uploads
        - name: WORKFLOW_PLATFORM
          value: qingtian
        - name: DIFY_BASE_URL
          value: http://118.145.238.55
        - name: DIFY_RUN_URL
          value: http://118.145.238.55/v1/workflows/run
        - name: DIFY_API_KEY
          value: app-uDv2z8nsENOcDwWRqlE8TTJ1
        - name: DIFY_API_KEY_TEST
          value: app-uDv2z8nsENOcDwWRqlE8TTJ1
        - name: DIFY_API_KEY_PRODUCTION
          value: app-4tkMWaWMbeOc7c4reJ4N907s
        - name: DIFY_INVITATION_STRATEGY_API_KEY
          value: app-Lm1JRKXZgCasRvhlU6jaSd3C
        - name: DIFY_USER_ID
          value: klh
        - name: DIFY_IMAGE_MODE
          value: file_id
        - name: DIFY_STREAM_INIT_TIMEOUT_MS
          value: '30000'
        - name: DIFY_POLL_INTERVAL_MS
          value: '2000'
        - name: DIFY_POLL_TIMEOUT_MS
          value: '900000'
        - name: QINGTIAN_BASE_URL
          value: https://qingtian.dfmc.com.cn/api/proxy/api/v1
        - name: QINGTIAN_API_KEY_TEST
          value: d9a4pdn9vlnv8q4uau3g
        - name: QINGTIAN_API_KEY_PRODUCTION
          value: d9a4pdn9vlnv8q4uau3g
        - name: QINGTIAN_INVITATION_STRATEGY_API_KEY
          value: d9b0iun9vlnv8q50kh1g
        - name: QINGTIAN_USER_ID
          value: sys_prod
        - name: QINGTIAN_POLL_INTERVAL_MS
          value: '2000'
        - name: QINGTIAN_POLL_TIMEOUT_MS
          value: '2400000'
        - name: MYSQL_HOST
          value: 10.81.67.146
        - name: MYSQL_PORT
          value: '13306'
        - name: MYSQL_DATABASE
          value: customer_profile
        - name: MYSQL_USER
          value: ai_app
        - name: MYSQL_PASSWORD
          value: Kbd*e5E09N
        - name: WORKER_CONCURRENCY
          value: '1'
        - name: WORKER_ROLE
          value: commercial
        - name: COMMERCIAL_QUEUE_THRESHOLD
          value: '5'
        # Keep this aligned with the local Worker. Backend-aware claims ensure
        # this Worker only polls runIds created with the commercial AppKey.
        - name: RETRY_MAX_POLL_RECOVERIES
          value: '3'
        - name: RETRY_MAX_RUN_LIFETIME_SECONDS
          value: '7200'
      restartPolicy: Always
      terminationGracePeriodSeconds: 60
      dnsPolicy: ClusterFirst
      serviceAccountName: default
      serviceAccount: default
      securityContext: {}
      schedulerName: default-scheduler
      volumes:
      - name: logs
        persistentVolumeClaim:
          claimName: customer-profile-logs
  strategy:
    type: Recreate
  revisionHistoryLimit: 10
  progressDeadlineSeconds: 600

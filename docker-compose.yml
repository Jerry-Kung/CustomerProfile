# API plus local/commercial Worker containers. MySQL/Dify/QingTian are external (configure via .env).
# Shared volume: API saves multipart uploads here; worker reads paths for DIFY_IMAGE_MODE=file_id.
services:
  migrate:
    build: .
    command: ["customer-profile-migrate"]
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
    restart: "no"

  api:
    build: .
    ports:
      # Host port (container listens on 18008)
      - "${HOST_API_PORT:-18008}:18008"
    env_file:
      - .env
    environment:
      API_HOST: 0.0.0.0
      API_PORT: "18008"
      TASK_UPLOAD_DIR: /var/lib/customer-profile/task-uploads
    volumes:
      - task_uploads:/var/lib/customer-profile/task-uploads
      - ./logs:/app/logs
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build: .
    command: ["customer-profile-worker"]
    env_file:
      - .env
    environment:
      TASK_UPLOAD_DIR: /var/lib/customer-profile/task-uploads
      WORKER_ROLE: local
      # Keep the legacy workflow lineage id so pre-006 runIds remain recoverable.
      WORKFLOW_TARGET_ID: local-default
      WORKFLOW_TARGET_REVISION: "${LOCAL_WORKFLOW_TARGET_REVISION:-v1}"
      WORKER_TARGET_MODE: "${LOCAL_WORKER_TARGET_MODE:-active}"
      WORKER_TASK_TYPES: "customer_profile,invitation_strategy"
    volumes:
      - task_uploads:/var/lib/customer-profile/task-uploads
      - ./logs:/app/logs
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  commercial-worker:
    # Commercial workflow target 01.
    build: .
    command: ["customer-profile-worker"]
    env_file:
      - .env
    environment:
      TASK_UPLOAD_DIR: /var/lib/customer-profile/task-uploads
      WORKER_ROLE: commercial
      # Keep the legacy workflow lineage id so pre-006 runIds remain recoverable.
      WORKFLOW_TARGET_ID: commercial-default
      WORKFLOW_TARGET_REVISION: "${COMMERCIAL_1_WORKFLOW_TARGET_REVISION:-v1}"
      WORKER_TARGET_MODE: "${COMMERCIAL_1_WORKER_TARGET_MODE:-active}"
      WORKER_TASK_TYPES: customer_profile
      WORKER_CONCURRENCY: "${COMMERCIAL_WORKER_CONCURRENCY:-1}"
      COMMERCIAL_QUEUE_THRESHOLD: "${COMMERCIAL_QUEUE_THRESHOLD:-5}"
      QINGTIAN_API_KEY_TEST: "${QINGTIAN_COMMERCIAL_API_KEY_TEST:-}"
      QINGTIAN_API_KEY_PRODUCTION: "${QINGTIAN_COMMERCIAL_API_KEY_PRODUCTION:-}"
    volumes:
      - task_uploads:/var/lib/customer-profile/task-uploads
      - ./logs:/app/logs
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  task_uploads:

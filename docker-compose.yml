# API, invitation Worker, legacy recovery Worker and profile Runner.
# MySQL and workflow services are external (configure via .env).
# Shared volume: API saves multipart uploads here; worker reads paths for DIFY_IMAGE_MODE=file_id.
services:
  migrate:
    build: .
    command: ["customer-profile-migrate"]
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
    restart: "no"

  api:
    build: .
    ports:
      # Host port (container listens on 18008)
      - "${HOST_API_PORT:-18008}:18008"
    env_file:
      - .env
    environment:
      API_HOST: 0.0.0.0
      API_PORT: "18008"
      TASK_UPLOAD_DIR: /var/lib/customer-profile/task-uploads
      # New profiles have one execution target; retries stay on the Runner.
      RETRY_POLICY_VERSION: single_target_v1
    volumes:
      - task_uploads:/var/lib/customer-profile/task-uploads
      - ./logs:/app/logs
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build: .
    command: ["customer-profile-worker"]
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TASK_UPLOAD_DIR: /var/lib/customer-profile/task-uploads
      WORKER_ROLE: local
      # Keep the legacy workflow lineage id so pre-006 runIds remain recoverable.
      WORKFLOW_TARGET_ID: local-default
      WORKFLOW_TARGET_REVISION: "${LOCAL_WORKFLOW_TARGET_REVISION:-v1}"
      WORKER_TARGET_MODE: "${LOCAL_WORKER_TARGET_MODE:-active}"
      # New tasks are invitations only; owned remote runs can still recover.
      WORKER_TASK_TYPES: invitation_strategy
    volumes:
      - task_uploads:/var/lib/customer-profile/task-uploads
      - ./logs:/app/logs
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  commercial-worker:
    # Recover existing commercial runs without accepting new profile tasks.
    build: .
    command: ["customer-profile-worker"]
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TASK_UPLOAD_DIR: /var/lib/customer-profile/task-uploads
      WORKER_ROLE: commercial
      # Keep the legacy workflow lineage id so pre-006 runIds remain recoverable.
      WORKFLOW_TARGET_ID: commercial-default
      WORKFLOW_TARGET_REVISION: "${COMMERCIAL_1_WORKFLOW_TARGET_REVISION:-v1}"
      WORKER_TARGET_MODE: recovery_only
      WORKER_TASK_TYPES: customer_profile
      WORKER_CONCURRENCY: "${COMMERCIAL_WORKER_CONCURRENCY:-1}"
      COMMERCIAL_QUEUE_THRESHOLD: "${COMMERCIAL_QUEUE_THRESHOLD:-5}"
      QINGTIAN_API_KEY_TEST: "${QINGTIAN_COMMERCIAL_API_KEY_TEST:-}"
      QINGTIAN_API_KEY_PRODUCTION: "${QINGTIAN_COMMERCIAL_API_KEY_PRODUCTION:-}"
    volumes:
      - task_uploads:/var/lib/customer-profile/task-uploads
      - ./logs:/app/logs
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  profile-runner-worker:
    build: .
    image: customer-profile-runner-adapter:local
    command: ["customer-profile-worker"]
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      WORKFLOW_PLATFORM: runner
      WORKER_ROLE: local
      WORKFLOW_TARGET_ID: profile-runner-production
      WORKFLOW_TARGET_REVISION: "${PROFILE_RUNNER_TARGET_REVISION:-v1}"
      WORKER_TASK_TYPES: customer_profile
      WORKER_WORK_ENVS: production
      WORKER_TARGET_MODE: "${PROFILE_RUNNER_TARGET_MODE:-active}"
      WORKER_CONCURRENCY: "${PROFILE_RUNNER_CONCURRENCY:-1}"
    volumes:
      - ./logs:/app/logs
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 60s

volumes:
  task_uploads:

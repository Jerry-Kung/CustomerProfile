<title>画像管线 AB 对照</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --bg:#f3f5f7;--surface:#ffffff;--surface-2:#e9edf0;--surface-3:#f8fafb;
  --fg:#13171c;--fg-2:#434d59;--muted:#6c7683;
  --line:#dce2e7;--line-2:#edf0f3;
  --v2:#0b6a62;--v2-bg:#dff3f0;--v2-line:#9cd7cf;
  --base:#9a5706;--base-bg:#fdf0db;--base-line:#e9c68e;
  --ok:#0d6530;--ok-bg:#e1f3e7;--ok-line:#a6d7b7;
  --warn:#8a5104;--warn-bg:#fdefd8;--warn-line:#e7c68c;
  --err:#a01b1b;--err-bg:#fae7e7;--err-line:#e8b1b1;
  --info:#375363;--info-bg:#e8eef3;
  --code-bg:#edf0f3;--code-fg:#242e38;
  --shadow:0 1px 2px rgba(16,22,30,.05),0 2px 10px rgba(16,22,30,.04);
  --r:10px;color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1115;--surface:#161a20;--surface-2:#1d222a;--surface-3:#131720;
  --fg:#e7eaee;--fg-2:#b2bbc6;--muted:#87919d;
  --line:#252b33;--line-2:#1f242b;
  --v2:#5dd7c7;--v2-bg:#0e2d2b;--v2-line:#1e5853;
  --base:#e7af49;--base-bg:#2e2310;--base-line:#5a4517;
  --ok:#59c87c;--ok-bg:#112b1b;--ok-line:#235a37;
  --warn:#e7af49;--warn-bg:#2e2310;--warn-line:#5a4517;
  --err:#ee8383;--err-bg:#321515;--err-line:#692a2a;
  --info:#9bb4c4;--info-bg:#1a2229;
  --code-bg:#1a1f26;--code-fg:#c6d0da;
  --shadow:0 1px 2px rgba(0,0,0,.42);color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0e1115;--surface:#161a20;--surface-2:#1d222a;--surface-3:#131720;
  --fg:#e7eaee;--fg-2:#b2bbc6;--muted:#87919d;
  --line:#252b33;--line-2:#1f242b;
  --v2:#5dd7c7;--v2-bg:#0e2d2b;--v2-line:#1e5853;
  --base:#e7af49;--base-bg:#2e2310;--base-line:#5a4517;
  --ok:#59c87c;--ok-bg:#112b1b;--ok-line:#235a37;
  --warn:#e7af49;--warn-bg:#2e2310;--warn-line:#5a4517;
  --err:#ee8383;--err-bg:#321515;--err-line:#692a2a;
  --info:#9bb4c4;--info-bg:#1a2229;
  --code-bg:#1a1f26;--code-fg:#c6d0da;
  --shadow:0 1px 2px rgba(0,0,0,.42);color-scheme:dark;
}
body{font-family:var(--sans);background:var(--bg);color:var(--fg);font-size:15px;line-height:1.62;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;font-weight:600;line-height:1.32;text-wrap:balance}
p{margin:0}
a{color:var(--v2)}
code,pre,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
hr{border:0;border-top:1px solid var(--line);margin:0}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:1240px;margin:0 auto;padding:12px 18px 0;display:flex;flex-direction:column;gap:10px}
.brand{display:flex;align-items:center;gap:11px;min-width:0;flex-wrap:wrap}
.mark{width:26px;height:26px;border-radius:7px;flex:none;background:linear-gradient(135deg,var(--v2) 40%,var(--base))}
.brand h1{font-size:17px;letter-spacing:-.01em}
.brand .sub{font-size:12px;color:var(--muted);font-family:var(--mono)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-bottom:-1px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{appearance:none;border:0;background:none;font:inherit;font-size:13.5px;font-weight:500;color:var(--muted);padding:8px 12px;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
.tabs button:hover{color:var(--fg-2)}
.tabs button[aria-selected="true"]{color:var(--v2);border-bottom-color:var(--v2)}

main{max-width:1240px;margin:0 auto;padding-block:22px 84px;padding-inline:18px}
.view{display:flex;flex-direction:column;gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card>.hd{padding:11px 15px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.card>.hd h3{font-size:14px}
.card>.hd .meta{margin-left:auto;font-size:11.5px;color:var(--muted);font-family:var(--mono)}
.card>.bd{padding:15px}
.card>.bd.tight{padding:0}
.sec-h{font-size:11.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.scroll{overflow-x:auto;max-width:100%}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:8px 11px;border-bottom:1px solid var(--line-2);vertical-align:top}
th{font-weight:600;font-size:11.5px;letter-spacing:.04em;color:var(--muted);background:var(--surface-3);position:sticky;top:0;z-index:1}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface-3)}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:2px 7px;border-radius:99px;border:1px solid transparent;white-space:nowrap;line-height:1.5}
.b-v2{background:var(--v2-bg);color:var(--v2);border-color:var(--v2-line)}
.b-base{background:var(--base-bg);color:var(--base);border-color:var(--base-line)}
.b-ok{background:var(--ok-bg);color:var(--ok);border-color:var(--ok-line)}
.b-warn{background:var(--warn-bg);color:var(--warn);border-color:var(--warn-line)}
.b-err{background:var(--err-bg);color:var(--err);border-color:var(--err-line)}
.b-info{background:var(--info-bg);color:var(--info);border-color:var(--line)}
.b-mut{background:var(--surface-2);color:var(--muted);border-color:var(--line)}
.note{font-size:13px;color:var(--fg-2);background:var(--info-bg);border-left:3px solid var(--v2-line);padding:10px 13px;border-radius:0 8px 8px 0}
.note.warn{background:var(--warn-bg);border-left-color:var(--warn-line)}
.note.err{background:var(--err-bg);border-left-color:var(--err-line)}
.note.ok{background:var(--ok-bg);border-left-color:var(--ok-line)}
.note strong{color:var(--fg)}
pre.blk{margin:0;background:var(--code-bg);color:var(--code-fg);padding:12px 14px;border-radius:8px;font-size:12.5px;line-height:1.56;white-space:pre-wrap;word-break:break-word;max-height:560px;overflow:auto}
details.dt{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
details.dt+details.dt{margin-top:8px}
details.dt>summary{cursor:pointer;padding:9px 13px;font-size:13px;font-weight:500;list-style:none;display:flex;align-items:center;gap:8px;background:var(--surface-3)}
details.dt>summary::-webkit-details-marker{display:none}
details.dt>summary::before{content:'\25B8';color:var(--muted);font-size:11px;transition:transform .12s}
details.dt[open]>summary::before{transform:rotate(90deg)}
details.dt>summary:hover{background:var(--surface-2)}
details.dt>.dt-bd{padding:13px;border-top:1px solid var(--line-2)}
.dt-meta{margin-left:auto;font-size:11.5px;color:var(--muted);font-family:var(--mono);flex:none}
.kv{display:grid;grid-template-columns:minmax(92px,auto) 1fr;gap:6px 14px;font-size:13px}
.kv dt{color:var(--muted);font-size:12px;padding-top:1px}
.kv dd{margin:0;min-width:0;word-break:break-word}
.nul{color:var(--muted);opacity:.6;font-style:italic;font-size:12.5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.verdict{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:920px){.grid2,.verdict{grid-template-columns:1fr}}
.vc{padding:14px 15px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow)}
.vc h4{font-size:13px;margin-bottom:9px}
.vc ul{margin:0;padding-left:17px;display:flex;flex-direction:column;gap:8px;font-size:13px;color:var(--fg-2)}
.vc li::marker{color:var(--muted)}
.vc.up{border-top:3px solid var(--ok)}
.vc.dn{border-top:3px solid var(--err)}
.vc.fl{border-top:3px solid var(--muted)}
.kpi{display:flex;flex-wrap:wrap;gap:10px}
.kpi .u{flex:1 1 152px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.kpi .u .n{font-family:var(--mono);font-size:21px;font-weight:600;letter-spacing:-.02em}
.kpi .u .l{font-size:11.5px;color:var(--muted);margin-top:2px}
.kpi .u .d{font-size:11.5px;margin-top:5px;font-family:var(--mono)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{appearance:none;font:inherit;font-size:12.5px;font-family:var(--mono);padding:5px 10px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--fg-2);cursor:pointer}
.chip:hover{border-color:var(--v2-line)}
.chip[aria-pressed="true"]{background:var(--v2);color:var(--bg);border-color:var(--v2);font-weight:600}
.subtabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line)}
.subtabs::-webkit-scrollbar{display:none}
.subtabs button{appearance:none;border:0;background:none;font:inherit;font-size:13.5px;font-weight:500;color:var(--muted);padding:7px 12px;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
.subtabs button[aria-selected="true"]{color:var(--v2);border-bottom-color:var(--v2)}
.cmp{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface);box-shadow:var(--shadow)}
.cmp-hd{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-3);border-bottom:1px solid var(--line)}
.cmp-hd>div{padding:8px 13px;font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:7px}
.cmp-hd>div:first-child{border-right:1px solid var(--line)}
.cmp-row{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line-2)}
.cmp-row:last-child{border-bottom:0}
.cmp-row>div{padding:11px 13px;min-width:0}
.cmp-row>div:first-child{border-right:1px solid var(--line-2)}
@media(max-width:780px){
 .cmp-hd,.cmp-row{grid-template-columns:1fr}
 .cmp-hd>div:first-child{border-right:0;border-bottom:1px solid var(--line)}
 .cmp-row>div:first-child{border-right:0;border-bottom:1px dashed var(--line)}
}
.item{padding:11px 12px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);margin-bottom:9px}
.item:last-child{margin-bottom:0}
.item .t{font-weight:600;font-size:13.5px;margin-bottom:3px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.item .d{font-size:13px;color:var(--fg-2)}
.rz{margin-top:8px;font-size:12.5px}
.rz>summary{cursor:pointer;color:var(--muted);font-size:12px;list-style:none}
.rz>summary::-webkit-details-marker{display:none}
.rz>summary::before{content:'\25B8 ';font-size:10px}
.rz[open]>summary::before{content:'\25BE '}
.rz .rz-bd{margin-top:7px;padding-left:11px;border-left:2px solid var(--line);display:flex;flex-direction:column;gap:7px}
.rz .lb{font-size:10.5px;font-weight:600;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.rz ol,.rz ul{margin:0;padding-left:16px;color:var(--fg-2)}
.rz li{margin-bottom:2px}
.ev{display:flex;flex-wrap:wrap;gap:5px}
.ev span{font-family:var(--mono);font-size:11.5px;background:var(--code-bg);color:var(--code-fg);padding:1px 6px;border-radius:4px}
.conf{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.finding{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line-2);font-size:13px}
.finding:last-child{border-bottom:0}
.finding .sev{flex:none;width:54px}
.finding .fx{min-width:0}
.finding .ft{font-weight:600;font-size:13px}
.tag{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
footer{max-width:1240px;margin:0 auto;padding-block:0 44px;padding-inline:18px;color:var(--muted);font-size:12.5px;display:flex;flex-direction:column;gap:6px}
.loading{padding:56px 20px;text-align:center;color:var(--muted);font-size:14px}
.err-box{padding:18px;border:1px solid var(--err-line);background:var(--err-bg);color:var(--err);border-radius:var(--r);font-size:13.5px}
</style>
<header class="top">
 <div class="top-in">
  <div class="brand">
   <span class="mark" aria-hidden="true"></span>
   <h1>画像管线 AB 对照</h1>
   <span class="sub" id="brand-sub">加载中…</span>
  </div>
  <div class="tabs" role="tablist" id="tabs">
   <button role="tab" data-v="overview" aria-selected="true">总览</button>
   <button role="tab" data-v="problems">老问题复检</button>
   <button role="tab" data-v="cases">逐案对照</button>
   <button role="tab" data-v="method">口径与边界</button>
  </div>
 </div>
</header>
<main><div id="app" class="loading">正在载入 8 案数据…</div></main>
<footer id="foot"></footer>
<script src="app.js"></script>

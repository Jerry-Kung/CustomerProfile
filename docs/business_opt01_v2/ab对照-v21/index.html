<title>画像管线 AB 对照 v2.1</title>
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --display:Georgia,'Times New Roman','Songti SC','Noto Serif CJK SC','SimSun',serif;
  --sans:'Segoe UI',system-ui,-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
  --mono:'Cascadia Mono','Consolas',ui-monospace,Menlo,monospace;

  --paper:#f1f2ee;--surface:#ffffff;--sunken:#e9ebe6;--tint:#f7f8f5;
  --ink:#181b19;--ink2:#454e4a;--muted:#798280;
  --rule:#d6d9d3;--rule2:#e6e9e4;

  --v2:#14564a;--v2bg:#e0efe9;--v2line:#a5cbc0;
  --base:#85541a;--basebg:#f7ecdd;--baseline:#dcc3a0;
  --add:#2b6b3e;--addbg:#e2f0e6;--addline:#a7cfb3;
  --del:#9c3524;--delbg:#f8e6e2;--delline:#e0b3a9;
  --warn:#8a5a10;--warnbg:#f9eeda;--warnline:#ddc78f;
  --info:#3d5566;--infobg:#e8eef2;
  --r:3px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#121513;--surface:#191d1b;--sunken:#202522;--tint:#1d211f;
  --ink:#e8ebe7;--ink2:#aeb6b1;--muted:#87908b;
  --rule:#2b322e;--rule2:#232927;
  --v2:#6fd0b8;--v2bg:#0e2b25;--v2line:#255247;
  --base:#dda85e;--basebg:#2c2110;--baseline:#5a4522;
  --add:#6cc286;--addbg:#0f2a18;--addline:#27512f;
  --del:#e58a76;--delbg:#2e1613;--delline:#5a2c24;
  --warn:#dda85e;--warnbg:#2c2110;--warnline:#5a4522;
  --info:#a5bccb;--infobg:#1b2429;
}}
:root[data-theme="dark"]{
  --paper:#121513;--surface:#191d1b;--sunken:#202522;--tint:#1d211f;
  --ink:#e8ebe7;--ink2:#aeb6b1;--muted:#87908b;
  --rule:#2b322e;--rule2:#232927;
  --v2:#6fd0b8;--v2bg:#0e2b25;--v2line:#255247;
  --base:#dda85e;--basebg:#2c2110;--baseline:#5a4522;
  --add:#6cc286;--addbg:#0f2a18;--addline:#27512f;
  --del:#e58a76;--delbg:#2e1613;--delline:#5a2c24;
  --warn:#dda85e;--warnbg:#2c2110;--warnline:#5a4522;
  --info:#a5bccb;--infobg:#1b2429;
}

body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14.5px;line-height:1.66;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;font-weight:600;line-height:1.28;text-wrap:balance}
p{margin:0}
a{color:var(--v2)}
code,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
::selection{background:var(--v2line)}

/* ---------- 报头 ---------- */
.masthead{border-bottom:2px solid var(--ink);background:var(--surface)}
.mh-in{max-width:1360px;margin:0 auto;padding:26px 24px 18px}
.mh-top{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.mh-top h1{font-family:var(--display);font-size:27px;font-weight:700;letter-spacing:-.015em}
.mh-top .tagline{font-size:13px;color:var(--muted)}
.lede{font-family:var(--display);font-size:18.5px;line-height:1.72;max-width:74ch;color:var(--ink)}
.lede b{font-weight:700;font-variant-numeric:tabular-nums}
.lede .up{color:var(--add);font-weight:700}
.lede .dn{color:var(--del);font-weight:700}
.mh-meta{display:flex;flex-wrap:wrap;gap:0 26px;margin-top:16px;padding-top:13px;border-top:1px solid var(--rule2);font-size:12.5px;color:var(--muted)}
.mh-meta span b{color:var(--ink2);font-weight:600;font-family:var(--mono);font-size:12px}

/* ---------- 视图切换 ---------- */
.views{display:flex;gap:0;border-bottom:1px solid var(--rule);background:var(--surface);position:sticky;top:0;z-index:20}
.views-in{max-width:1360px;margin:0 auto;padding:0 24px;display:flex;gap:0;width:100%}
.views button{appearance:none;border:0;background:none;font:inherit;font-family:var(--display);font-size:15.5px;font-weight:600;color:var(--muted);padding:11px 20px 10px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.views button:hover{color:var(--ink2)}
.views button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}

/* ---------- 主体 ---------- */
.shell{max-width:1360px;margin:0 auto;padding:24px 24px 100px;display:grid;grid-template-columns:228px minmax(0,1fr);gap:34px;align-items:start}
@media(max-width:1080px){.shell{grid-template-columns:1fr;gap:20px}}
.view{display:flex;flex-direction:column;gap:30px;min-width:0}
.block{display:flex;flex-direction:column;gap:13px;min-width:0}

/* ---------- 左栏 ---------- */
.rail{position:sticky;top:64px;display:flex;flex-direction:column;gap:22px}
@media(max-width:1080px){.rail{position:static}}
.rail h4{font-family:var(--display);font-size:12px;font-weight:600;letter-spacing:.02em;color:var(--muted);padding-bottom:6px;border-bottom:1px solid var(--rule)}
.rail-list{display:flex;flex-direction:column;gap:1px}
@media(max-width:1080px){.rail-list{flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:4px}}
.rail-list button{appearance:none;border:0;background:none;font:inherit;text-align:left;display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:var(--r);cursor:pointer;color:var(--ink2);white-space:nowrap}
.rail-list button:hover{background:var(--sunken)}
.rail-list button[aria-pressed="true"]{background:var(--v2bg);color:var(--v2);font-weight:600}
.rail-list .dot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--muted)}
.rail-list .ph{font-family:var(--mono);font-size:12.5px}
.rail-list .n{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.rail-list button[aria-pressed="true"] .n{color:var(--v2)}
.legend{display:flex;flex-direction:column;gap:9px;font-size:12.5px;color:var(--ink2)}
.legend .row{display:flex;align-items:center;gap:9px}
.sw{width:22px;height:12px;border-radius:2px;flex:none;border:1px solid}
.sw.s-v2{background:var(--v2bg);border-color:var(--v2line)}
.sw.s-base{background:var(--basebg);border-color:var(--baseline)}
.sw.s-add{background:var(--addbg);border-color:var(--addline)}
.sw.s-del{background:var(--delbg);border-color:var(--delline)}

/* ---------- 区块标题 ---------- */
.sh{display:flex;align-items:baseline;gap:12px;border-bottom:1.5px solid var(--ink);padding-bottom:7px;flex-wrap:wrap}
.sh h2{font-family:var(--display);font-size:20px;font-weight:700;letter-spacing:-.01em}
.sh .hint{font-size:12.5px;color:var(--muted);margin-left:auto}
.sh.sub{border-bottom-width:1px;border-bottom-color:var(--rule);padding-bottom:5px}
.sh.sub h3{font-family:var(--display);font-size:16px;font-weight:600}
.sh.sub .hint{font-size:12px}

/* ---------- 判定条 ---------- */
.verdicts{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:var(--r);overflow:hidden}
.vcard{background:var(--surface);padding:17px 18px;display:flex;flex-direction:column;gap:9px}
.vcard .flag{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700;letter-spacing:.02em}
.vcard .flag::before{content:'';width:9px;height:9px;border-radius:50%;flex:none}
.vcard.up .flag{color:var(--add)}.vcard.up .flag::before{background:var(--add)}
.vcard.dn .flag{color:var(--del)}.vcard.dn .flag::before{background:var(--del)}
.vcard.cal .flag{color:var(--warn)}.vcard.cal .flag::before{background:var(--warn)}
.vcard ul{margin:0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:8px;font-size:13.5px;color:var(--ink2)}
.vcard li{padding-left:13px;position:relative}
.vcard li::before{content:'';position:absolute;left:0;top:9px;width:4px;height:1.5px;background:var(--muted)}
.vcard li b{color:var(--ink);font-weight:600}
.vcard li code{font-size:12px;background:var(--sunken);padding:1px 5px;border-radius:2px}

/* ---------- 读数 ---------- */
.readout{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:var(--r);overflow:hidden}
.ro{background:var(--surface);padding:14px 16px}
.ro .v{font-family:var(--mono);font-size:20px;font-weight:600;letter-spacing:-.02em;line-height:1.2}
.ro .v .to{color:var(--muted);font-size:15px;font-weight:400;margin:0 5px}
.ro .v.good{color:var(--add)}
.ro .v.bad{color:var(--del)}
.ro .l{font-size:12px;color:var(--muted);margin-top:4px}
.ro .sub{font-size:11.5px;color:var(--muted);font-family:var(--mono);margin-top:5px}

/* ---------- 表格 ---------- */
.tblwrap{border:1px solid var(--rule);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.scroll{overflow-x:auto;max-width:100%}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:9px 13px;border-bottom:1px solid var(--rule2);vertical-align:top}
th{font-weight:600;font-size:11.5px;color:var(--muted);background:var(--tint);white-space:nowrap;position:sticky;top:0;z-index:1}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--tint)}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
td.k{font-family:var(--mono);font-size:12.5px;white-space:nowrap}
.better{color:var(--add);font-weight:600}
.worse{color:var(--del);font-weight:600}
.flat{color:var(--muted)}

/* ---------- 标记 ---------- */
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:2px;border:1px solid transparent;white-space:nowrap;line-height:1.6}
.t-v2{background:var(--v2bg);color:var(--v2);border-color:var(--v2line)}
.t-base{background:var(--basebg);color:var(--base);border-color:var(--baseline)}
.t-add{background:var(--addbg);color:var(--add);border-color:var(--addline)}
.t-del{background:var(--delbg);color:var(--del);border-color:var(--delline)}
.t-warn{background:var(--warnbg);color:var(--warn);border-color:var(--warnline)}
.t-info{background:var(--infobg);color:var(--info);border-color:var(--rule)}
.t-mut{background:var(--sunken);color:var(--muted);border-color:var(--rule)}
.t-ok{background:var(--addbg);color:var(--add);border-color:var(--addline)}

.nul{color:var(--muted);opacity:.65;font-style:italic;font-size:12.5px}

/* ---------- 单边差异（本页重点） ---------- */
.divergence{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:820px){.divergence{grid-template-columns:1fr}}
.dcol{border:1px solid var(--rule);border-radius:var(--r);overflow:hidden;background:var(--surface);display:flex;flex-direction:column}
.dcol .h{padding:9px 13px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:9px;border-bottom:1px solid var(--rule2)}
.dcol.only-base .h{background:var(--delbg);color:var(--del)}
.dcol.only-v2 .h{background:var(--addbg);color:var(--add)}
.dcol .h .ct{margin-left:auto;font-family:var(--mono);font-size:12px}
.dcol .list{display:flex;flex-direction:column}
.drow{display:flex;gap:11px;padding:9px 13px;border-bottom:1px solid var(--rule2);font-size:13px;align-items:baseline}
.drow:last-child{border-bottom:0}
.drow .sign{font-family:var(--mono);font-weight:700;font-size:13px;flex:none;width:11px}
.dcol.only-base .drow .sign{color:var(--del)}
.dcol.only-v2 .drow .sign{color:var(--add)}
.drow .body{min-width:0;display:flex;flex-direction:column;gap:2px}
.drow .fk{font-family:var(--mono);font-size:12px;color:var(--muted)}
.drow .fv{color:var(--ink);overflow-wrap:anywhere}
.dcol .empty{padding:20px 13px;text-align:center;color:var(--muted);font-size:12.5px}

/* ---------- 两栏对勘 ---------- */
.collate{border:1px solid var(--rule);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.col-head{display:grid;grid-template-columns:1fr 1fr;border-bottom:1.5px solid var(--ink);background:var(--tint)}
.col-head>div{padding:9px 15px;font-family:var(--display);font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:9px}
.col-head>div:first-child{border-right:1px solid var(--rule);color:var(--base)}
.col-head>div:last-child{color:var(--v2)}
.col-head .ct{margin-left:auto;font-family:var(--mono);font-size:11.5px;font-weight:500;color:var(--muted)}
.col-body{display:grid;grid-template-columns:1fr 1fr}
.col-body>div{padding:14px 15px;min-width:0}
.col-body>div:first-child{border-right:1px solid var(--rule2)}
.col-body>div>.sh.sub:first-child{margin-top:0}
@media(max-width:820px){
 .col-head,.col-body{grid-template-columns:1fr}
 .col-head>div:first-child{border-right:0;border-bottom:1px solid var(--rule)}
 .col-body>div:first-child{border-right:0;border-bottom:1px dashed var(--rule)}
}

/* Notes 行 */
.note-row{border:1px solid var(--rule2);border-left:3px solid var(--rule);border-radius:var(--r);padding:10px 12px;margin-bottom:9px;background:var(--surface)}
.note-row:last-child{margin-bottom:0}
.note-row.onlyv2{border-left-color:var(--add)}
.note-row.onlybase{border-left-color:var(--del)}
.nr-h{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.nr-k{font-family:var(--mono);font-size:12px;color:var(--muted)}
.nr-v{font-weight:600;font-size:13.5px;overflow-wrap:anywhere}
.nr-meta{margin-left:auto;display:flex;gap:6px;align-items:center}
.rz{margin-top:8px}
.rz>summary{cursor:pointer;font-size:12px;color:var(--muted);list-style:none;display:inline-flex;align-items:center;gap:5px}
.rz>summary::-webkit-details-marker{display:none}
.rz>summary::before{content:'▸';font-size:10px}
.rz[open]>summary::before{content:'▾'}
.rz-bd{margin-top:8px;padding:10px 12px;background:var(--tint);border-radius:var(--r);display:flex;flex-direction:column;gap:9px;font-size:12.5px;color:var(--ink2)}
.rz-bd .lb{font-size:10.5px;font-weight:700;letter-spacing:.05em;color:var(--muted);display:block;margin-bottom:3px}
.rz-bd ol,.rz-bd ul{margin:0;padding-left:17px}
.rz-bd li{margin-bottom:2px}
.ev{display:flex;flex-wrap:wrap;gap:5px}
.ev>span{font-size:12px;background:var(--surface);border:1px solid var(--rule);padding:1px 7px;border-radius:2px;color:var(--ink2)}

/* 画像卡条目 */
.item{border:1px solid var(--rule2);border-radius:var(--r);padding:10px 12px;margin-bottom:9px;background:var(--surface)}
.item:last-child{margin-bottom:0}
.item .t{font-weight:600;font-size:13.5px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.item .d{font-size:13px;color:var(--ink2);margin-top:3px}
.conf{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 13px;font-size:13px;margin:0}
.kv dt{color:var(--muted);font-size:12px}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}

.note{padding:11px 14px;border-left:3px solid var(--v2line);background:var(--infobg);font-size:13px;color:var(--ink2);border-radius:0 var(--r) var(--r) 0}
.note.warn{border-left-color:var(--warnline);background:var(--warnbg)}
.note.err{border-left-color:var(--delline);background:var(--delbg)}
.note.ok{border-left-color:var(--addline);background:var(--addbg)}
.note b{color:var(--ink)}

details.dt{border:1px solid var(--rule);border-radius:var(--r);overflow:hidden;background:var(--surface)}
details.dt+details.dt{margin-top:8px}
details.dt>summary{cursor:pointer;padding:10px 14px;font-size:13px;font-weight:500;list-style:none;display:flex;align-items:center;gap:9px;background:var(--tint)}
details.dt>summary::-webkit-details-marker{display:none}
details.dt>summary::before{content:'▸';color:var(--muted);font-size:11px}
details.dt[open]>summary::before{content:'▾'}
details.dt>summary:hover{background:var(--sunken)}
details.dt>.dt-bd{padding:14px;border-top:1px solid var(--rule2)}
.dt-meta{margin-left:auto;font-size:11.5px;color:var(--muted);font-family:var(--mono);flex:none}

pre.blk{margin:0;background:var(--tint);border:1px solid var(--rule2);color:var(--ink2);padding:12px 14px;border-radius:var(--r);font-size:12px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere;max-height:520px;overflow:auto}

.seg{display:flex;gap:0;border:1px solid var(--rule);border-radius:var(--r);overflow:hidden;background:var(--surface);flex-wrap:wrap}
.seg button{appearance:none;border:0;background:none;font:inherit;font-size:13px;color:var(--muted);padding:7px 15px;cursor:pointer;border-right:1px solid var(--rule2)}
.seg button:last-child{border-right:0}
.seg button:hover{background:var(--tint)}
.seg button[aria-selected="true"]{background:var(--v2bg);color:var(--v2);font-weight:600}

footer{max-width:1360px;margin:0 auto;padding:0 24px 56px;color:var(--muted);font-size:12.5px;display:flex;flex-direction:column;gap:5px}
.loading{padding:70px 24px;text-align:center;color:var(--muted)}
.err-box{padding:20px;border:1px solid var(--delline);background:var(--delbg);color:var(--del);border-radius:var(--r);font-size:13.5px}
</style>
<header class="masthead"><div class="mh-in">
  <div class="mh-top">
    <h1>画像管线 AB 对照</h1>
    <span class="tagline">v2.1 整改版 · 与基线同号 8 案逐案比对</span>
  </div>
  <p class="lede" id="lede">正在载入…</p>
  <div class="mh-meta" id="mh-meta"></div>
</div></header>
<nav class="views"><div class="views-in" id="views" role="tablist">
  <button role="tab" data-v="overview" aria-selected="true">总览</button>
  <button role="tab" data-v="cases">逐案对照</button>
</div></nav>
<div class="shell" id="shell"></div>
<footer id="foot"></footer>
<script src="app.js"></script>

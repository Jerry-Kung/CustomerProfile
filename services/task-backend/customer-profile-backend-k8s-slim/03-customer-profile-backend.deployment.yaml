kind: Deployment
apiVersion: apps/v1
metadata:
  name: customer-profile-backend
  namespace: aizt01-pro
  labels:
    app: customer-profile-backend
  annotations:
    deployment.kubernetes.io/revision: '1'
    lke.io/creator: p886702
spec:
  replicas: 1
  selector:
    matchLabels:
      app: customer-profile-backend
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: customer-profile-backend
      annotations:
        lke.io/creator: p886702
        lke.io/imagepullsecrets: '{}'
    spec:
      containers:
      - name: container-edgls5
        image: 'registry.dfmc.com.cn/mhero-ai/customer-profile-backend:arm64-latest'
        ports:
        - name: http-api
          containerPort: 18008
          protocol: TCP
        resources:
          limits:
            cpu: 200m
            memory: 250Mi
          requests:
            cpu: 100m
            memory: 100Mi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        imagePullPolicy: IfNotPresent
        command:
        - customer-profile-api
        readinessProbe:
          exec:
            command:
            - python
            - -c
            - import json,sys,urllib.request; data=json.load(urllib.request.urlopen('http://127.0.0.1:18008/health',
              timeout=3)); sys.exit(0 if data.get('status') == 'ok' and data.get('db_status')
              == 'up' else 1)
          initialDelaySeconds: 10
          periodSeconds: 15
          timeoutSeconds: 12
          failureThreshold: 3
        livenessProbe:
          tcpSocket:
            port: http-api
          initialDelaySeconds: 30
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
        volumeMounts:
        - name: task-uploads
          mountPath: /var/lib/customer-profile/task-uploads
        - name: logs
          mountPath: /app/logs
        env:
        - name: APP_ENV
          value: prod
        - name: LOG_LEVEL
          value: INFO
        - name: LOG_DIR
          value: /app/logs
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: API_HOST
          value: 0.0.0.0
        - name: API_PORT
          value: '18008'
        - name: WORKFLOW_PLATFORM
          value: qingtian
        - name: QINGTIAN_BASE_URL
          value: https://qingtian.dfmc.com.cn/api/proxy/api/v1
        - name: QINGTIAN_API_KEY_TEST
          value: d985kb79vlnv8q4p7fo0
        - name: QINGTIAN_API_KEY_PRODUCTION
          value: d985kb79vlnv8q4p7fo0
        - name: QINGTIAN_INVITATION_STRATEGY_API_KEY
          value: d985kb79vlnv8q4p7fo0
        - name: QINGTIAN_USER_ID
          value: sys_prod
        - name: MYSQL_HOST
          value: 10.81.67.146
        - name: MYSQL_PORT
          value: '13306'
        - name: MYSQL_DATABASE
          value: customer_profile
        - name: MYSQL_USER
          value: ai_app
        - name: MYSQL_PASSWORD
          value: Kbd*e5E09N
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst
      serviceAccountName: default
      serviceAccount: default
      securityContext: {}
      schedulerName: default-scheduler
      volumes:
      - name: task-uploads
        persistentVolumeClaim:
          claimName: customer-profile-task-uploads
      - name: logs
        persistentVolumeClaim:
          claimName: customer-profile-logs
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%
  revisionHistoryLimit: 10
  progressDeadlineSeconds: 600

  template:
    metadata:
      labels:
        app: customer-profile-worker
        app.kubernetes.io/name: customer-profile-backend
        app.kubernetes.io/component: worker
      annotations:
        lke.io/creator: lirui
        lke.io/imagepullsecrets: '{}'
    spec:
      containers:
      - name: container-customer-profile-worker
        image: registry.dfmc.com.cn/mhero-ai/customer-profile-backend:arm64-latest
        imagePullPolicy: Always
        command:
        - customer-profile-worker
        envFrom:
        - configMapRef:
            name: customer-profile-config
        - secretRef:
            name: customer-profile-secret
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: '2'
            memory: 1Gi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - name: task-uploads
          mountPath: /var/lib/customer-profile/task-uploads
        - name: logs
          mountPath: /app/logs
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
      restartPolicy: Always
      terminationGracePeriodSeconds: 60
      dnsPolicy: ClusterFirst
      serviceAccountName: default
      serviceAccount: default
      securityContext: {}
      schedulerName: default-scheduler
      volumes:
      - name: task-uploads
        persistentVolumeClaim:
          claimName: customer-profile-task-uploads
      - name: logs
        persistentVolumeClaim:
          claimName: customer-profile-logs
  strategy:
    type: Recreate
  revisionHistoryLimit: 10
  progressDeadlineSeconds: 600

---
apiVersion: batch/v1
kind: Job
metadata:
  name: customer-profile-migrate
  namespace: aizt01-pro
  labels:
    app: customer-profile-migrate
    app.kubernetes.io/name: customer-profile-backend
    app.kubernetes.io/component: migration
  annotations:
    lke.io/creator: lirui
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: customer-profile-migrate
        app.kubernetes.io/name: customer-profile-backend
        app.kubernetes.io/component: migration
      annotations:
        lke.io/creator: lirui
    spec:
      containers:
      - name: container-customer-profile-migrate
        image: registry.dfmc.com.cn/mhero-ai/customer-profile-backend:arm64-latest
        imagePullPolicy: Always
        command:
        - customer-profile-migrate
        envFrom:
        - configMapRef:
            name: customer-profile-config
        - secretRef:
            name: customer-profile-secret
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: '2'
            memory: 1Gi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - name: task-uploads
          mountPath: /var/lib/customer-profile/task-uploads
        - name: logs
          mountPath: /app/logs
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
      restartPolicy: OnFailure
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst
      serviceAccountName: default
      serviceAccount: default
      securityContext: {}
      schedulerName: default-scheduler
      volumes:
      - name: task-uploads
        persistentVolumeClaim:
          claimName: customer-profile-task-uploads
      - name: logs
        persistentVolumeClaim:
          claimName: customer-profile-logs
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-profile-api
  namespace: aizt01-pro
  labels:
    app: customer-profile-api
    app.kubernetes.io/name: customer-profile-backend
    app.kubernetes.io/component: api
  annotations:
    lke.io/creator: lirui
spec:
  replicas: 2
  selector:
    matchLabels:
      app: customer-profile-api
  template:
    metadata:
      labels:
        app: customer-profile-api
        app.kubernetes.io/name: customer-profile-backend
        app.kubernetes.io/component: api
      annotations:
        lke.io/creator: lirui
        lke.io/imagepullsecrets: '{}'
    spec:
      containers:
      - name: container-customer-profile-api
        image: registry.dfmc.com.cn/mhero-ai/customer-profile-backend:arm64-latest
        imagePullPolicy: Always
        command:
        - customer-profile-api
        envFrom:
        - configMapRef:
            name: customer-profile-config
        - secretRef:
            name: customer-profile-secret
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: '2'
            memory: 1Gi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - name: task-uploads
          mountPath: /var/lib/customer-profile/task-uploads
        - name: logs
          mountPath: /app/logs
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        ports:
        - name: http-api
          containerPort: 18008
          protocol: TCP
        readinessProbe:
          exec:
            command:
            - python
            - -c
            - import json,sys,urllib.request; data=json.load(urllib.request.urlopen('http://127.0.0.1:18008/health',
              timeout=3)); sys.exit(0 if data.get('status') == 'ok' and data.get('db_status')
              == 'up' else 1)
          initialDelaySeconds: 10
          periodSeconds: 15
          timeoutSeconds: 12
          failureThreshold: 3
        livenessProbe:
          tcpSocket:
            port: http-api
          initialDelaySeconds: 30
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst
      serviceAccountName: default
      serviceAccount: default
      securityContext: {}
      schedulerName: default-scheduler
      volumes:
      - name: task-uploads
        persistentVolumeClaim:
          claimName: customer-profile-task-uploads
      - name: logs
        persistentVolumeClaim:
          claimName: customer-profile-logs
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%
  revisionHistoryLimit: 10
  progressDeadlineSeconds: 600
---
apiVersion: v1
kind: Service
metadata:
  name: customer-profile-api
  namespace: aizt01-pro
  labels:
    app: customer-profile-api
    app.kubernetes.io/name: customer-profile-backend
    app.kubernetes.io/component: api
  annotations:
    lke.io/creator: lirui
spec:
  type: ClusterIP
  selector:
    app: customer-profile-api
  ports:
  - name: http-api
    port: 80
    targetPort: http-api
    protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-profile-worker
  namespace: aizt01-pro
  labels:
    app: customer-profile-worker
    app.kubernetes.io/name: customer-profile-backend

{{- if not .Values.workflowTargets }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.names.localWorker }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "customer-profile-backend.commonLabels" . | nindent 4 }}
    app: {{ .Values.names.localWorker }}
    app.kubernetes.io/component: worker
    app.kubernetes.io/instance-role: local
spec:
  replicas: {{ .Values.localWorker.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ .Values.names.localWorker }}
  template:
    metadata:
      labels:
        {{- include "customer-profile-backend.commonLabels" . | nindent 8 }}
        app: {{ .Values.names.localWorker }}
        app.kubernetes.io/component: worker
        app.kubernetes.io/instance-role: local
      annotations:
        checksum/config: {{ toJson .Values.config | sha256sum }}
        checksum/secrets: {{ toJson (dict "common" .Values.secrets.common "local" .Values.secrets.local) | sha256sum }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.localWorker.terminationGracePeriodSeconds }}
      containers:
        - name: customer-profile-worker
          image: {{ include "customer-profile-backend.image" . | quote }}
          imagePullPolicy: {{ .Values.localWorker.imagePullPolicy | default .Values.image.pullPolicy }}
          command:
            - customer-profile-worker
          envFrom:
            - configMapRef:
                name: {{ .Values.names.configMap }}
            - secretRef:
                name: {{ .Values.names.commonSecret }}
            - secretRef:
                name: {{ .Values.names.localSecret }}
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: WORKER_ROLE
              value: local
            - name: WORKFLOW_TARGET_ID
              value: local-default
            - name: WORKFLOW_TARGET_REVISION
              value: v1
            - name: WORKER_TARGET_MODE
              value: active
            - name: WORKER_TASK_TYPES
              value: customer_profile,invitation_strategy
            - name: WORKER_WORK_ENVS
              value: test,production
            - name: WORKER_CONCURRENCY
              value: {{ .Values.localWorker.concurrency | quote }}
            - name: RETRY_MAX_WORKFLOW_ATTEMPTS
              value: {{ .Values.retry.maxWorkflowAttempts | quote }}
            - name: RETRY_POLICY_VERSION
              value: {{ .Values.retry.policyVersion | quote }}
            - name: RETRY_MAX_POLL_RECOVERIES
              value: {{ .Values.retry.maxPollRecoveries | quote }}
            - name: RETRY_MAX_RUN_LIFETIME_SECONDS
              value: {{ .Values.retry.maxRunLifetimeSeconds | quote }}
          resources:
            {{- toYaml .Values.localWorker.resources | nindent 12 }}
          volumeMounts:
            - name: task-uploads
              mountPath: {{ .Values.config.TASK_UPLOAD_DIR }}
            - name: logs
              mountPath: {{ .Values.config.LOG_DIR }}
      volumes:
        - name: task-uploads
          {{- if .Values.persistence.taskUploads.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "customer-profile-backend.taskUploadsPvcName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: logs
          {{- if .Values.persistence.logs.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "customer-profile-backend.logsPvcName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
{{- end }}

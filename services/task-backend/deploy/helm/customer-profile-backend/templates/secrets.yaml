apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.names.commonSecret }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "customer-profile-backend.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: common-secret
type: Opaque
stringData:
  {{- range $key, $value := .Values.secrets.common }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
---

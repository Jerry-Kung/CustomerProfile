apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.names.service }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "customer-profile-backend.commonLabels" . | nindent 4 }}
    app: {{ .Values.names.api }}
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.service.type }}
  selector:
    app: {{ .Values.names.api }}
  ports:
    - name: http-api
      port: {{ .Values.service.port }}
      targetPort: http-api
      protocol: TCP

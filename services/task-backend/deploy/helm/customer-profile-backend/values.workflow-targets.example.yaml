# Overlay for the current 1-local + 3-commercial throughput layout.
#
# local-01 and commercial-01 reuse the two Secrets created by this chart.
# Create the two additional Secrets before installing this overlay:
#
#   kubectl -n aizt01-pro create secret generic customer-profile-workflow-commercial-02 \
#     --from-literal=QINGTIAN_API_KEY_TEST='...' \
#     --from-literal=QINGTIAN_API_KEY_PRODUCTION='...'
#
#   kubectl -n aizt01-pro create secret generic customer-profile-workflow-commercial-03 \
#     --from-literal=QINGTIAN_API_KEY_TEST='...' \
#     --from-literal=QINGTIAN_API_KEY_PRODUCTION='...'

config:
  WORKER_ROUTING_MODE: parallel
  COMMERCIAL_QUEUE_THRESHOLD: "5"
  COMMERCIAL_SPILLOVER_DELAY_SECONDS: "0"

retry:
  policyVersion: throughput_first_v1
  maxWorkflowAttempts: 3
  maxPollRecoveries: 3
  maxRunLifetimeSeconds: 7200

workflowTargets:
  - id: local-01
    name: customer-profile-worker-local-01
    pool: local
    revision: v1
    secretName: customer-profile-backend-local-secret
    mode: active
    replicas: 1
    concurrency: 5
    taskTypes: [customer_profile, invitation_strategy]
    workEnvs: [test, production]
    mountTaskUploads: true
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: "2"
        memory: 1Gi

  - id: commercial-01
    name: customer-profile-worker-commercial-01
    pool: commercial
    revision: v1
    secretName: customer-profile-backend-commercial-secret
    mode: active
    replicas: 1
    concurrency: 1
    taskTypes: [customer_profile]
    workEnvs: [test, production]
    mountTaskUploads: false
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: "2"
        memory: 1Gi

  - id: commercial-02
    name: customer-profile-worker-commercial-02
    pool: commercial
    revision: v1
    secretName: customer-profile-workflow-commercial-02
    mode: active
    replicas: 1
    concurrency: 1
    taskTypes: [customer_profile]
    workEnvs: [test, production]
    mountTaskUploads: false
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: "2"
        memory: 1Gi

  - id: commercial-03
    name: customer-profile-worker-commercial-03
    pool: commercial
    revision: v1
    secretName: customer-profile-workflow-commercial-03
    mode: active
    replicas: 1
    concurrency: 1
    taskTypes: [customer_profile]
    workEnvs: [test, production]
    mountTaskUploads: false
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: "2"
        memory: 1Gi

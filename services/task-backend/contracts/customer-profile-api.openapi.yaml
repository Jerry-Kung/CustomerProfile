openapi: 3.0.3
info:
  title: Customer Profile Backend API
  version: 1.0.0
  description: |
    API contract for customer profile analysis task submission, list query, and result query.
servers:
  - url: https://api.example.com
tags:
  - name: CustomerProfileTasks
    description: Customer profile task lifecycle APIs
paths:
  /v1/customer-profile/tasks:
    post:
      tags:
        - CustomerProfileTasks
      summary: Submit customer profile analysis task
      description: |
        Accepts a new task for a phone number. This endpoint is asynchronous and does not
        wait for workflow final output. Invitation execution_id makes resending the
        currently accepted execution idempotent; a new analysis uses a new identifier.
      operationId: submitCustomerProfileTask
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SubmitTaskRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SubmitTaskRequest'
      responses:
        '202':
          description: Task accepted and queued for processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskAcceptedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          description: Per-task-type waiting queue capacity exceeded
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      tags:
        - CustomerProfileTasks
      summary: List tasks by phone prefix
      description: Returns tasks where customer_phonenumber starts with given prefix.
      operationId: listCustomerProfileTasks
      parameters:
        - in: query
          name: phone_prefix
          required: true
          description: Prefix of customer phone number, e.g. "138".
          schema:
            type: string
            minLength: 1
            maxLength: 32
            pattern: '^[0-9+]+$'
        - in: query
          name: page
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: page_size
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Task list returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/customer-profile/tasks/{customer_phonenumber}/result:
    get:
      tags:
        - CustomerProfileTasks
      summary: Get task result by full phone number
      description: |
        Returns final output when task has succeeded. For processing or failed tasks,
        returns explicit business status and error code instead of empty payload.
      operationId: getCustomerProfileTaskResult
      parameters:
        - in: path
          name: customer_phonenumber
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 32
            pattern: '^[0-9+]+$'
      responses:
        '200':
          description: Task succeeded and output is available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResultSucceededResponse'
        '202':
          description: Task exists but still in progress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResultInProgressResponse'
        '422':
          description: Task finished with failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResultFailedResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  schemas:
    SubmitTaskRequest:
      type: object
      required:
        - customer_phonenumber
      properties:
        customer_phonenumber:
          type: string
          minLength: 1
          maxLength: 32
          pattern: '^[0-9+]+$'
        task_type:
          type: string
          enum: [customer_profile, invitation_strategy]
          default: customer_profile
        work_env:
          type: string
          enum: [test, production, develop]
          default: test
        batch_id:
          type: string
          nullable: true
          maxLength: 64
          description: Runner requires a non-empty batch of at most 50 characters.
        execution_id:
          type: string
          nullable: true
          pattern: '^[A-Za-z0-9_-]{1,64}$'
          description: Invitation only; requires batch_id. Unique for each analysis, even when the business batch is reused.
    TaskAcceptedResponse:
      type: object
      required:
        - code
        - message
        - customer_phonenumber
        - status
      properties:
        task_id:
          type: integer
          nullable: true
        generation:
          type: integer
        batch_id:
          type: string
          nullable: true
        execution_id:
          type: string
          nullable: true
        task_type:
          type: string
        code:
          type: string
          example: TASK_ACCEPTED
        message:
          type: string
          example: task accepted
        customer_phonenumber:
          type: string
        status:
          type: string
          enum: [queued, processing, retry_wait, succeeded, failed]
    TaskListItem:
      type: object
      required:
        - customer_phonenumber
        - status
        - updated_at
      properties:
        customer_phonenumber:
          type: string
        card_id:
          type: string
          nullable: true
        nickname:
          type: string
          nullable: true
        status:
          type: string
          enum: [queued, processing, succeeded, failed]
        updated_at:
          type: string
          format: date-time
    TaskListResponse:
      type: object
      required:
        - code
        - message
        - items
        - page
        - page_size
        - total
      properties:
        code:
          type: string
          example: OK
        message:
          type: string
          example: success
        items:
          type: array
          items:
            $ref: '#/components/schemas/TaskListItem'
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
    TaskResultSucceededResponse:
      type: object
      required:
        - code
        - message
        - customer_phonenumber
        - status
        - output
      properties:
        task_id:
          type: integer
          nullable: true
        generation:
          type: integer
        batch_id:
          type: string
          nullable: true
        execution_id:
          type: string
          nullable: true
        task_type:
          type: string
        code:
          type: string
          example: TASK_SUCCEEDED
        message:
          type: string
          example: task succeeded
        customer_phonenumber:
          type: string
        status:
          type: string
          enum: [succeeded]
        output:
          $ref: 'customer-profile-output.schema.json'
        card_id:
          type: string
          nullable: true
        nickname:
          type: string
          nullable: true
        updated_at:
          type: string
          format: date-time
    TaskResultInProgressResponse:
      type: object
      required:
        - code
        - message
        - customer_phonenumber
        - status
      properties:
        task_id:
          type: integer
          nullable: true
        generation:
          type: integer
        batch_id:
          type: string
          nullable: true
        execution_id:
          type: string
          nullable: true
        task_type:
          type: string
        code:
          type: string
          enum:
            - TASK_QUEUED
            - TASK_PROCESSING
        message:
          type: string
          example: task is still running
        customer_phonenumber:
          type: string
        status:
          type: string
          enum: [queued, processing]
        updated_at:
          type: string
          format: date-time
    TaskResultFailedResponse:
      type: object
      required:
        - code
        - message
        - customer_phonenumber
        - status
      properties:
        task_id:
          type: integer
          nullable: true
        generation:
          type: integer
        batch_id:
          type: string
          nullable: true
        execution_id:
          type: string
          nullable: true
        task_type:
          type: string
        last_error_code:
          type: string
          nullable: true
        last_error_stage:
          type: string
          nullable: true
        code:
          type: string
          enum:
            - TASK_FAILED
            - DIFY_REQUEST_FAILED
            - DIFY_TIMEOUT
            - DIFY_OUTPUT_INVALID_JSON
            - DIFY_OUTPUT_SCHEMA_MISMATCH
            - INVITATION_WRITEBACK_MISSING
            - INVITATION_REQUIRES_RECONCILIATION
        message:
          type: string
          example: task failed
        customer_phonenumber:
          type: string
        status:
          type: string
          enum: [failed]
        error_message:
          type: string
          nullable: true
        updated_at:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: INVALID_ARGUMENT
        message:
          type: string
          example: phone_prefix is required
        details:
          type: object
          additionalProperties: true
          nullable: true
  responses:
    BadRequest:
      description: Invalid request arguments
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalidArgument:
              value:
                code: INVALID_ARGUMENT
                message: customer_phonenumber format is invalid
    NotFound:
      description: Task not found by full phone number
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            notFound:
              value:
                code: TASK_NOT_FOUND
                message: task for this phone number does not exist
    Conflict:
      description: Request conflicts with current task state
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            executionInputConflict:
              value:
                code: EXECUTION_CONFLICT
                message: execution_id was already accepted with different inputs
    UnprocessableEntity:
      description: Business rule validation or execution failure
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            outputInvalidJson:
              value:
                code: DIFY_OUTPUT_INVALID_JSON
                message: output is not valid JSON string
    TooManyRequests:
      description: Request is throttled by server
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            throttled:
              value:
                code: RATE_LIMITED
                message: too many requests, please retry later
    InternalServerError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            internalError:
              value:
                code: INTERNAL_ERROR
                message: unexpected error

[project]
name = "customer-profile"
version = "0.5.4"
description = "潜在目标客户人设画像分析工作流（Python 实现）"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
pythonpath = ["src"]
markers = [
  "mysql_integration: 需要真实 MySQL 的方言契约测试；未配 CUSTOMER_PROFILE_MYSQL_URL 时跳过",
]

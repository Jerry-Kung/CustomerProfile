name: customer-profile

x-service: &service
  image: ${CP_IMAGE:-customer-profile-unified:uat}
  pull_policy: never
  init: true
  restart: unless-stopped
  env_file:
    - ${CP_ENV_FILE:-.env}
  volumes:
    - profile-data:/app/data
  extra_hosts:
    - "host.docker.internal:host-gateway"

x-environment: &environment
  # 数据库地址**不在这里写死**：取 .env 的 DATABASE_URL。
  # 写死在这里会盖掉 env_file，导致「改了 .env 却没生效」——而且 SQLite 与 MySQL
  # 的切换只应是一次配置变更，不该重打镜像。
  DATA_DIR: /app/data
  INLINE_WORKER: "false"
  # Business concurrency belongs to backend; execute the jobs it has dispatched.
  WORKER_CONCURRENCY: ""
  # Two execution processes split the configured global LLM RPM/TPM budget.
  WORKER_REPLICAS: "2"
  # 建不建表由后端类型决定，没有开关：SQLite 由服务进程自建（本地产物，给个路径
  # 就能跑），MySQL 由 runtime-migrate 容器建，运行进程不持 DDL 权限。

x-task-environment: &task-environment
  PYTHONPATH: /app/services/task-backend
  PATH: /opt/task-venv/bin:/usr/local/bin:/usr/local/sbin:/usr/sbin:/usr/bin:/sbin:/bin
  LOG_DIR: /app/logs

x-task: &task
  image: ${CP_IMAGE:-customer-profile-unified:uat}
  pull_policy: never
  init: true
  working_dir: /app/services/task-backend
  env_file:
    - ${TASK_ENV_FILE:-${CP_ENV_FILE:-.env}}
  environment: *task-environment
  volumes:
    - task-logs:/app/logs
  extra_hosts:
    - "host.docker.internal:host-gateway"
  restart: unless-stopped

x-task-worker: &task-worker
  <<: *task
  command: ["/opt/task-venv/bin/customer-profile-worker"]
  depends_on:
    backend-api:
      condition: service_healthy
  stop_grace_period: 60s

services:
  runtime-profile-api:
    container_name: runtime-profile-api-${COMPOSE_PROJECT_NAME:-customer-profile}
    <<: *service
    # 等初始化容器成功退出再启动：库结构没就绪时启动，只会得到一个「Up 但写不进去」
    # 的进程。初始化失败则这里根本不启动，故障在部署阶段暴露而不是在第一个任务上。
    depends_on:
      runtime-migrate:
        condition: service_completed_successfully
    # Preserve the original internal hostname during the naming transition.
    networks:
      default:
        aliases: [api]
    # Build once; all other services use this same image.
    build:
      context: .
    command: ["python", "-m", "customer_profile.main"]
    environment:
      <<: *environment
      WORKFLOW_SCOPE: profile
      SERVE_UI: "true"
      API_HOST: "0.0.0.0"
      API_PORT: "${API_PORT:-18173}"
      # Only worker startup recovers abandoned runs; API restarts must not
      # interrupt runs that the separate worker is still executing.
      INTERRUPT_ON_START: "false"
    ports:
      - "${CP_API_PORT:-${API_PORT:-18173}}:${API_PORT:-18173}"
    stop_grace_period: 90s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json, os, urllib.request; response = urllib.request.urlopen('http://127.0.0.1:' + os.environ['API_PORT'] + '/health', timeout=5); assert json.load(response)['status'] == 'ok'"
      interval: 15s
      timeout: 6s
      start_period: 30s
      retries: 3

  runtime-profile-worker:
    container_name: runtime-profile-worker-${COMPOSE_PROJECT_NAME:-customer-profile}
    <<: *service
    depends_on:
      runtime-migrate:
        condition: service_completed_successfully
    command: ["python", "-m", "customer_profile.worker"]
    environment:
      <<: *environment
      WORKFLOW_SCOPE: profile
      INTERRUPT_ON_START: "true"
    # Workflows can take more than 30 minutes. SIGTERM stops new claims and
    # lets the current workflow finish before Docker may force termination.
    stop_grace_period: 60m
    # 进程存活不等于**还在消费**：数据库线程死掉后容器仍是 Up，积压却无人处理。
    # 这里读 worker 周期性写的存活信号，过期即判 unhealthy，让故障自己浮出来。
    healthcheck:
      test: ["CMD", "python", "-m", "customer_profile.liveness", "--check"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 2

  runtime-invitation-api:
    container_name: runtime-invitation-api-${COMPOSE_PROJECT_NAME:-customer-profile}
    networks:
      default:
        aliases: [inbound]
    <<: *service
    depends_on:
      runtime-migrate:
        condition: service_completed_successfully
    command: ["python", "-m", "customer_profile.inbound"]
    environment:
      <<: *environment
      WORKFLOW_SCOPE: invitation
      INTERRUPT_ON_START: "false"
      INBOUND_HOST: "0.0.0.0"
      INBOUND_PORT: "${INBOUND_PORT:-8099}"
    ports:
      - "${INBOUND_PORT:-8099}:${INBOUND_PORT:-8099}"
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json, os, urllib.request; response = urllib.request.urlopen('http://127.0.0.1:' + os.environ['INBOUND_PORT'] + '/health', timeout=5); assert json.load(response)['status'] == 'ok'"
      interval: 15s
      timeout: 6s
      start_period: 30s
      retries: 3

  runtime-invitation-worker:
    container_name: runtime-invitation-worker-${COMPOSE_PROJECT_NAME:-customer-profile}
    <<: *service
    depends_on:
      runtime-migrate:
        condition: service_completed_successfully
    command: ["python", "-m", "customer_profile.worker"]
    environment:
      <<: *environment
      WORKFLOW_SCOPE: invitation
      INTERRUPT_ON_START: "true"
    stop_grace_period: 60m
    healthcheck:
      test: ["CMD", "python", "-m", "customer_profile.liveness", "--check"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 2

  backend-migrate:
    container_name: backend-migrate-${COMPOSE_PROJECT_NAME:-customer-profile}
    <<: *task
    profiles: ["maintenance"]
    command: ["/opt/task-venv/bin/customer-profile-migrate"]
    restart: "no"

  # ---- 运行时库初始化（每次部署自动执行，幂等，只补缺失项） --------------------
  #
  # **不是 maintenance profile**：它挂在每次 `up` 的启动链上，由
  # `depends_on: service_completed_successfully` 让四个运行服务等它成功。
  # 运维因此不需要记住「这个库初始化过没有」，也不需要判断升级后该补哪一列：
  # 容器自己比对 information_schema 与代码里的 DDL，缺表建表、缺列加列。
  #
  #   docker compose up -d --no-build          # 自动带上它
  #   docker compose run --rm runtime-migrate --check   # 只自检不改库
  #
  # DATABASE_URL 是 sqlite 时也照常建表（`--allow-sqlite`）：部署链对两种后端做同一件事，
  # 服务启动前结构就已就绪。
  #
  # 失败即停：退出码非 0 时依赖它的服务不会启动，避免「服务 Up、表不齐、任务全失败」。
  # 权限上，这个容器是唯一需要 DDL 权限的进程；运行服务完全不带建表能力。
  runtime-migrate:
    container_name: runtime-migrate-${COMPOSE_PROJECT_NAME:-customer-profile}
    <<: *service
    command:
      - python
      - -m
      - customer_profile.persistence.init_db
      - --allow-sqlite
    restart: "no"
    environment:
      <<: *environment

  backend-api:
    container_name: backend-api-${COMPOSE_PROJECT_NAME:-customer-profile}
    <<: *task
    command: ["/opt/task-venv/bin/customer-profile-api"]
    environment:
      <<: *task-environment
      API_HOST: 0.0.0.0
      API_PORT: "${TASK_API_PORT:-18008}"
    ports:
      - "${TASK_HOST_API_PORT:-${HOST_API_PORT:-18008}}:${TASK_API_PORT:-18008}"
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; urllib.request.urlopen('http://127.0.0.1:'+os.environ['API_PORT']+'/ready',timeout=3)"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3

  backend-qingtian-worker:
    container_name: backend-qingtian-worker-${COMPOSE_PROJECT_NAME:-customer-profile}
    <<: *task-worker
    environment:
      <<: *task-environment
      WORKFLOW_PLATFORM: qingtian
      WORKER_ROLE: local
      WORKFLOW_TARGET_ID: "${QINGTIAN_WORKER_TARGET_ID:-local-default}"
      WORKFLOW_TARGET_REVISION: "${QINGTIAN_WORKER_TARGET_REVISION:-${LOCAL_WORKFLOW_TARGET_REVISION:-v1}}"
      WORKER_TARGET_MODE: "${QINGTIAN_WORKER_TARGET_MODE:-${LOCAL_WORKER_TARGET_MODE:-draining}}"
      WORKER_TASK_TYPES: "${QINGTIAN_WORKER_TASK_TYPES:-customer_profile}"
      WORKER_WORK_ENVS: "${QINGTIAN_WORKER_WORK_ENVS:-test,production}"
      WORKER_CONCURRENCY: "${QINGTIAN_WORKER_CONCURRENCY:-1}"

  backend-commercial-worker:
    container_name: backend-commercial-worker-${COMPOSE_PROJECT_NAME:-customer-profile}
    <<: *task-worker
    environment:
      <<: *task-environment
      WORKFLOW_PLATFORM: qingtian
      WORKER_ROLE: commercial
      WORKFLOW_TARGET_ID: "${COMMERCIAL_WORKER_TARGET_ID:-commercial-default}"
      WORKFLOW_TARGET_REVISION: "${COMMERCIAL_WORKER_TARGET_REVISION:-${COMMERCIAL_1_WORKFLOW_TARGET_REVISION:-v1}}"
      WORKER_TARGET_MODE: "${COMMERCIAL_WORKER_TARGET_MODE:-${COMMERCIAL_1_WORKER_TARGET_MODE:-draining}}"
      WORKER_TASK_TYPES: "${COMMERCIAL_WORKER_TASK_TYPES:-customer_profile}"
      WORKER_WORK_ENVS: "${COMMERCIAL_WORKER_WORK_ENVS:-test,production}"
      WORKER_CONCURRENCY: "${COMMERCIAL_WORKER_CONCURRENCY:-1}"
      QINGTIAN_API_KEY_TEST: "${QINGTIAN_COMMERCIAL_API_KEY_TEST:-}"
      QINGTIAN_API_KEY_PRODUCTION: "${QINGTIAN_COMMERCIAL_API_KEY_PRODUCTION:-}"

  backend-profile-worker:
    container_name: backend-profile-worker-${COMPOSE_PROJECT_NAME:-customer-profile}
    <<: *task-worker
    depends_on:
      backend-api:
        condition: service_healthy
      runtime-profile-api:
        condition: service_healthy
    environment:
      <<: *task-environment
      WORKFLOW_PLATFORM: runner
      WORKER_ROLE: local
      WORKFLOW_TARGET_ID: "${PROFILE_RUNNER_TARGET_ID:-profile-runner-production}"
      WORKFLOW_TARGET_REVISION: "${PROFILE_RUNNER_TARGET_REVISION:-v1}"
      WORKER_TASK_TYPES: "${PROFILE_RUNNER_TASK_TYPES:-customer_profile}"
      WORKER_WORK_ENVS: "${PROFILE_RUNNER_WORK_ENVS:-production}"
      WORKER_TARGET_MODE: "${PROFILE_RUNNER_TARGET_MODE:-active}"
      WORKER_CONCURRENCY: "${PROFILE_RUNNER_CONCURRENCY:-5}"
      PROFILE_RUNNER_BASE_URL_TEST: "${PROFILE_RUNNER_BASE_URL_TEST:-}"
      PROFILE_RUNNER_BASE_URL_PRODUCTION: "${PROFILE_RUNNER_BASE_URL_PRODUCTION:-http://runtime-profile-api:${API_PORT:-18173}}"

  backend-invitation-worker:
    container_name: backend-invitation-worker-${COMPOSE_PROJECT_NAME:-customer-profile}
    <<: *task-worker
    profiles: ["invitation-runner"]
    depends_on:
      backend-api:
        condition: service_healthy
      runtime-invitation-api:
        condition: service_healthy
    environment:
      <<: *task-environment
      WORKFLOW_PLATFORM: invitation_runner
      WORKER_ROLE: local
      WORKFLOW_TARGET_ID: "${INVITATION_RUNNER_TARGET_ID:-invitation-runner-test}"
      WORKFLOW_TARGET_REVISION: "${INVITATION_RUNNER_TARGET_REVISION:-v1}"
      WORKER_TASK_TYPES: invitation_strategy
      WORKER_WORK_ENVS: "${INVITATION_RUNNER_WORK_ENVS:-test}"
      WORKER_TARGET_MODE: "${INVITATION_RUNNER_TARGET_MODE:-active}"
      WORKER_CONCURRENCY: "${INVITATION_RUNNER_CONCURRENCY:-5}"
      INVITATION_RUNNER_BASE_URL_TEST: "${INVITATION_RUNNER_BASE_URL_TEST:-http://runtime-invitation-api:${INBOUND_PORT:-8099}}"
      INVITATION_RUNNER_BASE_URL_PRODUCTION: "${INVITATION_RUNNER_BASE_URL_PRODUCTION:-}"

volumes:
  profile-data:
  task-logs:
